[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "local-nllb-pipeline"
version = "0.1.0"
description = "Fully local translation pipeline using NLLB, CTranslate2, local LLM post-editing, and quality gates"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
  "ctranslate2>=4.4,<5",
  "transformers>=4.45,<5",
  "sentencepiece>=0.2,<1",
  "sacrebleu>=2.4,<3",
  "sacremoses>=0.1,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
spacy = ["spacy>=3.7,<4"]
nltk = ["nltk>=3.9,<4"]
comet = ["unbabel-comet>=2.2,<3"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.8,<1"]
all = [
  "spacy>=3.7,<4",
  "nltk>=3.9,<4",
  "unbabel-comet>=2.2,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
local-translate = "local_nllb.cli:main"
local-translate-job = "local_nllb.job:main"
local-translate-api = "local_nllb.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_nllb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

